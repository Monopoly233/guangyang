stages:
  - build
  - deploy

variables:
  DOCKER_TLS_CERTDIR: ""
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"

build:
  stage: build
  image: docker:27
  services:
    - name: docker:27-dind
      command: ["--mtu=1450"]
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE/go:$IMAGE_TAG" gobackend
    - docker build -t "$CI_REGISTRY_IMAGE/py:$IMAGE_TAG" python/FastAPI
    - docker build -t "$CI_REGISTRY_IMAGE/web:$IMAGE_TAG" frontend
    - docker push "$CI_REGISTRY_IMAGE/go:$IMAGE_TAG"
    - docker push "$CI_REGISTRY_IMAGE/py:$IMAGE_TAG"
    - docker push "$CI_REGISTRY_IMAGE/web:$IMAGE_TAG"
    # 也打一个 latest 方便服务器只拉 latest（可按需移除）
    - docker tag "$CI_REGISTRY_IMAGE/go:$IMAGE_TAG" "$CI_REGISTRY_IMAGE/go:latest"
    - docker tag "$CI_REGISTRY_IMAGE/py:$IMAGE_TAG" "$CI_REGISTRY_IMAGE/py:latest"
    - docker tag "$CI_REGISTRY_IMAGE/web:$IMAGE_TAG" "$CI_REGISTRY_IMAGE/web:latest"
    - docker push "$CI_REGISTRY_IMAGE/go:latest"
    - docker push "$CI_REGISTRY_IMAGE/py:latest"
    - docker push "$CI_REGISTRY_IMAGE/web:latest"
  only:
    - main

deploy:
  stage: deploy
  image: alpine:3.20
  before_script:
    - apk add --no-cache openssh-client rsync bash
    - mkdir -p ~/.ssh
    - echo "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
  script:
    # 把 compose 文件和需要的运行时目录同步到服务器
    - rsync -az --delete docker-compose.prod.yml .env.example "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
    - rsync -az --delete wechatpay "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/" || true
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" "cd $DEPLOY_PATH && IMAGE_TAG=latest CI_REGISTRY_IMAGE=$CI_REGISTRY_IMAGE docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY && docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d"
  only:
    - main

