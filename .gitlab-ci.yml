variables:
  # Runner 和应用在同一台 GitLab 服务器上，保留运行时目录，避免清理证书/临时结果。
  GIT_CLEAN_FLAGS: -ffdx -e tmp/ -e wechatpay/
  LOCAL_IMAGE_PREFIX: gy
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  COMPARE_JOB_FEE_FEN: "1"

stages:
  - deploy

deploy_single_host:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
  script:
    - set -euo pipefail
    - echo "======== [1/4] 检查 Docker / Compose ========"
    - docker version
    - docker compose version
    - echo "======== [2/4] 准备单机持久化目录 ========"
    - mkdir -p /opt/app/gy/tmp /opt/app/gy/redis /opt/app/gy/wechatpay/cert
    - echo "======== [3/4] 构建本机镜像 ========"
    - docker compose -f docker-compose.prod.yml build
    - echo "======== [4/4] 在本机启动/更新服务 ========"
    - docker compose -f docker-compose.prod.yml up -d --remove-orphans
    - docker compose -f docker-compose.prod.yml ps
