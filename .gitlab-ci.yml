variables:
  # 核心修复：强制 Git 在清理时忽略权限报错的文件，防止流水线死在 Checkout 阶段
  GIT_CLEAN_FLAGS: -ffdx -e tmp/ -e wechatpay/

  # ACR (Alibaba Cloud Container Registry)
  # 在 GitLab 项目 Settings -> CI/CD -> Variables 里配置：
  # - ACR_USERNAME / ACR_PASSWORD
  # 可按需覆盖 ACR_NAMESPACE / IMAGE_TAG
  # 说明（非常关键）：
  # - 你的 GitLab Runner ECS 当前在 VPC: vpc-f8z6hufc72u4capmua46n
  # - 你的 ACK/ACR 专有网络在另一个 VPC（不同 VPC 下 ACR 的 *-vpc 域名不会解析）
  # 因此：
  # - CI 推镜像：建议开启 ACR「公网入口」并使用公网域名（本默认值）
  # - ACK 拉镜像：后续部署到 K8s 时可继续用 *-vpc 内网域名（更快更稳）
  ACR_REGISTRY: guangyang-registry.cn-heyuan.cr.aliyuncs.com
  ACR_NAMESPACE: guangyang
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA

  # 0.01 元 = 1 分（可在 GitLab Variables 覆盖）
  COMPARE_JOB_FEE_FEN: "1"

stages:
  - build_push
  - deploy

acr_build_push:
  stage: build_push
  # shell 执行器（宿主机需已安装 docker）
  script:
    - set -euo pipefail
    - echo "======== [1/3] 校验变量 ========"
    - test -n "${ACR_REGISTRY:-}"
    - test -n "${ACR_NAMESPACE:-}"
    - test -n "${ACR_USERNAME:-}"
    - test -n "${ACR_PASSWORD:-}"
    - test -n "${IMAGE_TAG:-}"
    - echo "ACR_REGISTRY=$ACR_REGISTRY"
    - echo "ACR_NAMESPACE=$ACR_NAMESPACE"
    - echo "IMAGE_TAG=$IMAGE_TAG"

    - echo "======== [2/3] 登录并构建镜像 ========"
    - echo "$ACR_PASSWORD" | docker login --username "$ACR_USERNAME" --password-stdin "$ACR_REGISTRY"

    - docker build -t "$ACR_REGISTRY/$ACR_NAMESPACE/web:$IMAGE_TAG" -f frontend/Dockerfile frontend
    - docker build -t "$ACR_REGISTRY/$ACR_NAMESPACE/go:$IMAGE_TAG" -f gobackend/Dockerfile gobackend
    - docker build -t "$ACR_REGISTRY/$ACR_NAMESPACE/python:$IMAGE_TAG" -f python/FastAPI/Dockerfile python/FastAPI

    - echo "======== [3/3] 推送镜像 ========"
    - docker push "$ACR_REGISTRY/$ACR_NAMESPACE/web:$IMAGE_TAG"
    - docker push "$ACR_REGISTRY/$ACR_NAMESPACE/go:$IMAGE_TAG"
    - docker push "$ACR_REGISTRY/$ACR_NAMESPACE/python:$IMAGE_TAG"

    # main 分支额外推送 latest，方便 ACK 先用 latest 跑通
    - |
      if [ "${CI_COMMIT_BRANCH:-}" = "main" ]; then
        docker tag "$ACR_REGISTRY/$ACR_NAMESPACE/web:$IMAGE_TAG" "$ACR_REGISTRY/$ACR_NAMESPACE/web:latest"
        docker tag "$ACR_REGISTRY/$ACR_NAMESPACE/go:$IMAGE_TAG" "$ACR_REGISTRY/$ACR_NAMESPACE/go:latest"
        docker tag "$ACR_REGISTRY/$ACR_NAMESPACE/python:$IMAGE_TAG" "$ACR_REGISTRY/$ACR_NAMESPACE/python:latest"
        docker push "$ACR_REGISTRY/$ACR_NAMESPACE/web:latest"
        docker push "$ACR_REGISTRY/$ACR_NAMESPACE/go:latest"
        docker push "$ACR_REGISTRY/$ACR_NAMESPACE/python:latest"
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# 预留：后续接 ACK 自动部署（kubectl/helm）
deploy_ack:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  script:
    - set -euo pipefail
    - echo "======== [1/4] 准备 kubeconfig ========"
    - test -n "${KUBECONFIG_B64:-}"
    - mkdir -p "$HOME/.kube"
    - echo "$KUBECONFIG_B64" | base64 -d > "$HOME/.kube/config"
    - chmod 600 "$HOME/.kube/config"
    - export KUBECONFIG="$HOME/.kube/config"

    - echo "======== [2/4] 检查 kubectl ========"
    - |
      if ! command -v kubectl >/dev/null 2>&1; then
        echo "kubectl 未安装，请先在 Runner ECS 上安装 kubectl（建议放到 /usr/local/bin/kubectl）"
        exit 1
      fi

    - echo "======== [3/4] 连接集群验证 ========"
    - kubectl version --client=true
    - kubectl get nodes

    - echo "======== [4/4] 部署到 ACK ========"
    - echo "======== (pre) 配置 ACR 拉取凭据 ========"
    - |
      # 为 namespace gy 配置 imagePullSecret，解决 ACR 私有仓库 ImagePullBackOff
      # 注意：镜像地址使用 *-vpc 域名时，secret 的 docker-server 也必须一致
      ACR_PULL_REGISTRY="guangyang-registry-vpc.cn-heyuan.cr.aliyuncs.com"
      if ! kubectl get ns gy >/dev/null 2>&1; then
        kubectl apply -f k8s/00-namespace.yaml
      fi
      if ! kubectl -n gy get secret acr-pull >/dev/null 2>&1; then
        test -n "${ACR_USERNAME:-}"
        test -n "${ACR_PASSWORD:-}"
        kubectl -n gy create secret docker-registry acr-pull \
          --docker-server="$ACR_PULL_REGISTRY" \
          --docker-username="$ACR_USERNAME" \
          --docker-password="$ACR_PASSWORD"
      fi
      kubectl -n gy patch serviceaccount default \
        -p '{"imagePullSecrets":[{"name":"acr-pull"}]}' >/dev/null || true

    - kubectl apply -f k8s/
    - echo "======== (post) 固定使用本次镜像 TAG ========"
    - |
      # 避免依赖 latest 造成“拉到旧镜像/缓存镜像”导致行为不一致
      test -n "${IMAGE_TAG:-}"
      ACR_PULL_REGISTRY="guangyang-registry-vpc.cn-heyuan.cr.aliyuncs.com"
      kubectl -n gy set image deploy/go go="$ACR_PULL_REGISTRY/$ACR_NAMESPACE/go:$IMAGE_TAG"
      kubectl -n gy set image deploy/python python="$ACR_PULL_REGISTRY/$ACR_NAMESPACE/python:$IMAGE_TAG"
      kubectl -n gy set image deploy/web web="$ACR_PULL_REGISTRY/$ACR_NAMESPACE/web:$IMAGE_TAG"

    - echo "======== (post) 注入计费/微信支付配置（来自 GitLab Variables） ========"
    - |
      # 1) 强制 compare 费用（分）
      kubectl -n gy set env deploy/go "COMPARE_JOB_FEE_FEN=${COMPARE_JOB_FEE_FEN:-1}" >/dev/null || true

      # 2) WeChatPay 运行时环境变量（建议在 GitLab -> CI/CD Variables 配置）
      # 必填通常至少包括：WECHAT_NOTIFY_URL / WECHAT_MCHID / WECHAT_PAY_APPID / WECHAT_API_V3_KEY
      # 平台验签材料二选一：
      # - WECHAT_PLATFORM_PUBLIC_KEY_B64（推荐，base64 后的 PEM 公钥） + 可选 WECHAT_PLATFORM_PUBLIC_KEY_ID
      # - 或通过 wechatpay-cert secret 提供 platform_cert.pem
      if [ -n "${WECHAT_NOTIFY_URL:-}" ] && [ -n "${WECHAT_MCHID:-}" ] && [ -n "${WECHAT_PAY_APPID:-}" ] && [ -n "${WECHAT_API_V3_KEY:-}" ]; then
        tmpdir="$(mktemp -d)"
        extra=()
        if [ -n "${WECHAT_PLATFORM_PUBLIC_KEY_B64:-}" ]; then
          echo "$WECHAT_PLATFORM_PUBLIC_KEY_B64" | base64 -d > "$tmpdir/platform_public_key.pem"
          extra+=(--from-file="WECHAT_PLATFORM_PUBLIC_KEY=$tmpdir/platform_public_key.pem")
        fi
        kubectl -n gy create secret generic wechatpay-env \
          --from-literal="WECHAT_NOTIFY_URL=$WECHAT_NOTIFY_URL" \
          --from-literal="WECHAT_MCHID=$WECHAT_MCHID" \
          --from-literal="WECHAT_PAY_APPID=$WECHAT_PAY_APPID" \
          --from-literal="WECHAT_APPID=${WECHAT_APPID:-}" \
          --from-literal="WECHAT_API_V3_KEY=$WECHAT_API_V3_KEY" \
          --from-literal="WECHAT_PLATFORM_PUBLIC_KEY_ID=${WECHAT_PLATFORM_PUBLIC_KEY_ID:-}" \
          --from-literal="WECHAT_MOCK=${WECHAT_MOCK:-0}" \
          "${extra[@]}" \
          --dry-run=client -o yaml | kubectl apply -f -
      else
        echo "skip wechatpay-env: required vars missing (set WECHAT_NOTIFY_URL/WECHAT_MCHID/WECHAT_PAY_APPID/WECHAT_API_V3_KEY)"
      fi

      # 3) WeChatPay 证书/私钥（推荐用 base64 单行变量，避免 masked 变量限制）
      # - WECHAT_MERCHANT_KEY_PEM_B64
      # - WECHAT_MERCHANT_CERT_PEM_B64
      # 或者：你只有商户证书 zip（程序会自动解压到 TMP_ROOT/wechatpay_cache/cert）
      # - WECHAT_MERCHANT_CERT_ZIP_B64
      # - WECHAT_MERCHANT_CERT_ZIP_NAME（必须匹配 <mchid>_YYYYMMDD_cert.zip，例如 1106035691_20260131_cert.zip）
      # 可选：
      # - WECHAT_PLATFORM_CERT_PEM_B64（如果你走平台证书模式验签）
      if [ -n "${WECHAT_MERCHANT_CERT_ZIP_B64:-}" ]; then
        test -n "${WECHAT_MERCHANT_CERT_ZIP_NAME:-}"
        tmpdir="$(mktemp -d)"
        echo "$WECHAT_MERCHANT_CERT_ZIP_B64" | base64 -d > "$tmpdir/$WECHAT_MERCHANT_CERT_ZIP_NAME"
        cert_args=(--from-file="$WECHAT_MERCHANT_CERT_ZIP_NAME=$tmpdir/$WECHAT_MERCHANT_CERT_ZIP_NAME")
        if [ -n "${WECHAT_PLATFORM_CERT_PEM_B64:-}" ]; then
          echo "$WECHAT_PLATFORM_CERT_PEM_B64" | base64 -d > "$tmpdir/platform_cert.pem"
          cert_args+=(--from-file="platform_cert.pem=$tmpdir/platform_cert.pem")
        fi
        kubectl -n gy create secret generic wechatpay-cert \
          "${cert_args[@]}" \
          --dry-run=client -o yaml | kubectl apply -f -
      elif [ -n "${WECHAT_MERCHANT_KEY_PEM_B64:-}" ] && [ -n "${WECHAT_MERCHANT_CERT_PEM_B64:-}" ]; then
        tmpdir="$(mktemp -d)"
        echo "$WECHAT_MERCHANT_KEY_PEM_B64" | base64 -d > "$tmpdir/merchant_key.pem"
        echo "$WECHAT_MERCHANT_CERT_PEM_B64" | base64 -d > "$tmpdir/merchant_cert.pem"
        cert_args=(--from-file="merchant_key.pem=$tmpdir/merchant_key.pem" --from-file="merchant_cert.pem=$tmpdir/merchant_cert.pem")
        if [ -n "${WECHAT_PLATFORM_CERT_PEM_B64:-}" ]; then
          echo "$WECHAT_PLATFORM_CERT_PEM_B64" | base64 -d > "$tmpdir/platform_cert.pem"
          cert_args+=(--from-file="platform_cert.pem=$tmpdir/platform_cert.pem")
        fi
        kubectl -n gy create secret generic wechatpay-cert \
          "${cert_args[@]}" \
          --dry-run=client -o yaml | kubectl apply -f -
      else
        echo "skip wechatpay-cert: set WECHAT_MERCHANT_CERT_ZIP_B64(+NAME) or set WECHAT_MERCHANT_KEY_PEM_B64 + WECHAT_MERCHANT_CERT_PEM_B64"
      fi

      # Secret 更新不会热加载到容器环境变量，显式滚动一次确保生效
      kubectl -n gy rollout restart deploy/go >/dev/null || true

      kubectl -n gy rollout status deploy/go --timeout=180s
      kubectl -n gy rollout status deploy/python --timeout=180s
      kubectl -n gy rollout status deploy/web --timeout=180s
    - kubectl -n gy get deploy,svc,pod
    - |
      # 若 Pod 处于 Pending，自动输出调度事件，方便定位（资源不足/污点/节点未就绪等）
      bad="$(kubectl -n gy get pod --no-headers 2>/dev/null | awk '$3=="Pending"||$3=="ImagePullBackOff"||$3=="ErrImagePull"{print $1}' || true)"
      if [ -n "$bad" ]; then
        echo "======== Pod Events (Pending/ImagePullBackOff) ========"
        for p in $bad; do
          echo "--- describe pod/$p (events) ---"
          kubectl -n gy describe pod "$p" | sed -n '/^Events:/,$p' || true
        done
      fi