stages:
  - deploy

deploy_job:
  stage: deploy
  script:
    - echo "======== 开始自动部署 ========"
    
    # 尝试在执行前清理残留的权限问题（如果 sudo 没配好，这行报错可以忽略）
    - sudo chown -R gitlab-runner:gitlab-runner . || true
    
    # 使用 -p gy 确保操作的是你之前手动启动的那个项目组
    - docker compose -p gy up -d --build --remove-orphans
    
    # 部署完清理垃圾
    - docker image prune -f
    - echo "======== 部署完成 ========"
  only:
    - main