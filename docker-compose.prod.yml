services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ${GY_DATA_DIR:-./runtime}/redis:/data
    networks:
      - appnet

  xlsconvert:
    image: ghcr.io/unoconv/unoserver-docker:latest
    restart: unless-stopped
    expose:
      - "2003"
    networks:
      - appnet

  web:
    image: ${LOCAL_IMAGE_PREFIX:-gy}/web:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8088}:80"
    depends_on:
      - go
    networks:
      - appnet

  go:
    image: ${LOCAL_IMAGE_PREFIX:-gy}/go:${IMAGE_TAG:-latest}
    build:
      context: ./gobackend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - PORT=8080
      - CORS_ALLOW_ORIGIN=*
      - TMP_ROOT=/app/tmp
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_DB=${REDIS_DB:-0}
      - COMPARE_STREAM_KEY=${COMPARE_STREAM_KEY:-gy:comparejobs:stream}
      - COMPARE_STREAM_GROUP=${COMPARE_STREAM_GROUP:-gy-compare}
      - COMPARE_STREAM_MAXLEN=${COMPARE_STREAM_MAXLEN:-100000}
      - COMPARE_JOB_FEE_FEN=${COMPARE_JOB_FEE_FEN:-1}
      - COMPARE_MAX_UPLOAD_MB=${COMPARE_MAX_UPLOAD_MB:-512}
      - COMPARE_TMP_RETENTION_MINUTES=${COMPARE_TMP_RETENTION_MINUTES:-30}
      - XLSCONVERT_HOST=xlsconvert
      - XLSCONVERT_PORT=2003
      - XLSCONVERT_PROTOCOL=http
      - XLSCONVERT_TIMEOUT_SECONDS=${XLSCONVERT_TIMEOUT_SECONDS:-90}
      # 单机部署强制关闭 OSS，避免 GitLab 残留 OSS_BUCKET 变量触发云存储初始化。
      - OSS_BUCKET=
      # WeChatPay config (建议用 .env / env.prod 或 CI 变量注入；不要写死在这里)
      - WECHAT_NOTIFY_URL=${WECHAT_NOTIFY_URL:-}
      - WECHAT_MCHID=${WECHAT_MCHID:-}
      - WECHAT_APPID=${WECHAT_APPID:-}
      - WECHAT_PAY_APPID=${WECHAT_PAY_APPID:-}
      - WECHAT_CORP_ID=${WECHAT_CORP_ID:-}
      - WECHAT_API_V3_KEY=${WECHAT_API_V3_KEY:-}
      - WECHAT_PLATFORM_PUBLIC_KEY_ID=${WECHAT_PLATFORM_PUBLIC_KEY_ID:-}
      - WECHAT_PLATFORM_PUBLIC_KEY=${WECHAT_PLATFORM_PUBLIC_KEY:-}
      - WECHAT_MOCK=${WECHAT_MOCK:-}
      - WECHAT_ALLOW_WW_APPID=${WECHAT_ALLOW_WW_APPID:-}
    volumes:
      # 微信支付证书/API key 独立挂载，避免被 runtime/ 清理或 Redis 权限影响。
      - ${WECHATPAY_DIR:-./wechatpay}:/app/wechatpay:ro
      - ${GY_DATA_DIR:-./runtime}/tmp:/app/tmp
    depends_on:
      - redis
      - xlsconvert
    expose:
      - "8080"
    networks:
      - appnet

  compare-worker:
    image: ${LOCAL_IMAGE_PREFIX:-gy}/go:${IMAGE_TAG:-latest}
    build:
      context: ./gobackend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["/app/compare-worker"]
    environment:
      - TMP_ROOT=/app/tmp
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_DB=${REDIS_DB:-0}
      - COMPARE_STREAM_KEY=${COMPARE_STREAM_KEY:-gy:comparejobs:stream}
      - COMPARE_STREAM_GROUP=${COMPARE_STREAM_GROUP:-gy-compare}
      - COMPARE_STREAM_MAXLEN=${COMPARE_STREAM_MAXLEN:-100000}
      - COMPARE_PAYGATE_STREAM_KEY=${COMPARE_PAYGATE_STREAM_KEY:-gy:comparejobs:paygate}
      - COMPARE_PAYGATE_STREAM_GROUP=${COMPARE_PAYGATE_STREAM_GROUP:-gy-paygate}
      - COMPARE_PAYGATE_STREAM_MAXLEN=${COMPARE_PAYGATE_STREAM_MAXLEN:-100000}
      - COMPARE_JOB_FEE_FEN=${COMPARE_JOB_FEE_FEN:-1}
      - STREAM_CONCURRENCY=${COMPARE_WORKER_CONCURRENCY:-2}
      - XLSCONVERT_HOST=xlsconvert
      - XLSCONVERT_PORT=2003
      - XLSCONVERT_PROTOCOL=http
      - XLSCONVERT_TIMEOUT_SECONDS=${XLSCONVERT_TIMEOUT_SECONDS:-90}
      - OSS_BUCKET=
    volumes:
      - ${GY_DATA_DIR:-./runtime}/tmp:/app/tmp
    depends_on:
      - redis
      - xlsconvert
    networks:
      - appnet

  payment-worker:
    image: ${LOCAL_IMAGE_PREFIX:-gy}/go:${IMAGE_TAG:-latest}
    build:
      context: ./gobackend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["/app/payment-worker"]
    environment:
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_DB=${REDIS_DB:-0}
      - COMPARE_PAYGATE_STREAM_KEY=${COMPARE_PAYGATE_STREAM_KEY:-gy:comparejobs:paygate}
      - COMPARE_PAYGATE_STREAM_GROUP=${COMPARE_PAYGATE_STREAM_GROUP:-gy-paygate}
      - COMPARE_PAYGATE_STREAM_MAXLEN=${COMPARE_PAYGATE_STREAM_MAXLEN:-100000}
      - COMPARE_JOB_FEE_FEN=${COMPARE_JOB_FEE_FEN:-1}
      - STREAM_CONCURRENCY=${PAYMENT_WORKER_CONCURRENCY:-4}
      - WECHAT_NOTIFY_URL=${WECHAT_NOTIFY_URL:-}
      - WECHAT_MCHID=${WECHAT_MCHID:-}
      - WECHAT_APPID=${WECHAT_APPID:-}
      - WECHAT_PAY_APPID=${WECHAT_PAY_APPID:-}
      - WECHAT_CORP_ID=${WECHAT_CORP_ID:-}
      - WECHAT_API_V3_KEY=${WECHAT_API_V3_KEY:-}
      - WECHAT_PLATFORM_PUBLIC_KEY_ID=${WECHAT_PLATFORM_PUBLIC_KEY_ID:-}
      - WECHAT_PLATFORM_PUBLIC_KEY=${WECHAT_PLATFORM_PUBLIC_KEY:-}
      - WECHAT_MOCK=${WECHAT_MOCK:-}
      - WECHAT_ALLOW_WW_APPID=${WECHAT_ALLOW_WW_APPID:-}
    volumes:
      - ${WECHATPAY_DIR:-./wechatpay}:/app/wechatpay:ro
    depends_on:
      - redis
    networks:
      - appnet

networks:
  appnet:
    driver: bridge

