apiVersion: apps/v1
kind: Deployment
metadata:
  name: xlsconvert
  namespace: gy
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: xlsconvert
  template:
    metadata:
      labels:
        app: xlsconvert
    spec:
      containers:
        - name: xlsconvert
          # 你需要把这个镜像 build/push 到你的 ACR
          image: guangyang-registry-vpc.cn-heyuan.cr.aliyuncs.com/guangyang/xlsconvert:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8090
          env:
            - name: PORT
              value: "8090"
            - name: TMP_ROOT
              value: "/tmp"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 3Gi
---
apiVersion: v1
kind: Service
metadata:
  name: xlsconvert
  namespace: gy
spec:
  selector:
    app: xlsconvert
  ports:
    - name: http
      port: 8090
      targetPort: http

