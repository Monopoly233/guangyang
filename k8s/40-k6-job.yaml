apiVersion: batch/v1
kind: Job
metadata:
  name: k6-compare
  namespace: gy
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: k6-compare
    spec:
      restartPolicy: Never
      initContainers:
        - name: fetch-files
          image: curlimages/curl:8.12.1
          imagePullPolicy: IfNotPresent
          env:
            # 需要你提供可下载的 URL（推荐 OSS 签名 URL，expire 设久一点）
            - name: FILE1_URL
              value: "https://guangyangoss.oss-cn-heyuan.aliyuncs.com/01.xlsx?Expires=1771649210&OSSAccessKeyId=TMP.3KpHJEVmWXiroXNKJLXqyDNuD4KYWc9jQR1GbGLAYTsiynfwiGqZMsmfFHmQhXiCTypJNjG3QdBXReVHoSRkyzTbunA7uq&Signature=ojfU9b%2FzDFkpOG1ZcILXVlgzOBw%3D"
            - name: FILE2_URL
              value: "https://guangyangoss.oss-cn-heyuan.aliyuncs.com/02.xlsx?Expires=1771649232&OSSAccessKeyId=TMP.3KpHJEVmWXiroXNKJLXqyDNuD4KYWc9jQR1GbGLAYTsiynfwiGqZMsmfFHmQhXiCTypJNjG3QdBXReVHoSRkyzTbunA7uq&Signature=tmg2hznhjw1xCStsSskS0lR%2B0wk%3D"
          command:
            - sh
            - -lc
            - |
              set -euo pipefail
              if [ -z "${FILE1_URL:-}" ] || [ -z "${FILE2_URL:-}" ]; then
                echo "ERROR: missing FILE1_URL/FILE2_URL" >&2
                exit 1
              fi
              mkdir -p /data
              echo "Downloading file1..."
              curl -fsSL "$FILE1_URL" -o /data/01.xlsx
              echo "Downloading file2..."
              curl -fsSL "$FILE2_URL" -o /data/02.xlsx
              ls -lh /data
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: k6
          image: grafana/k6:0.51.0
          imagePullPolicy: IfNotPresent
          args:
            - run
            - --vus
            - "10"
            - --duration
            - 2m
            - /work/k6_compare.js
          env:
            # 集群内直连 go Service（不要带 /api 前缀）
            - name: BASE_URL
              value: "http://go:8080"
            - name: FILE1
              value: "/data/01.xlsx"
            - name: FILE2
              value: "/data/02.xlsx"
          volumeMounts:
            - name: script
              mountPath: /work
              readOnly: true
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1
              memory: 512Mi
      volumes:
        # 由你从 repo 的 loadtest/k6_compare.js 创建 ConfigMap：k6-script
        - name: script
          configMap:
            name: k6-script
        - name: data
          emptyDir: {}

